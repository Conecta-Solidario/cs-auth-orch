# Server Configuration
server.port=8082

# Camel Servlet Configuration
camel.servlet.mapping.context-path=/api/v1/*

# Service URLs
cs.auth.service.url=http://localhost:8081

# JWT Configuration
jwt.secret=ChaveSecretaSuperSeguraParaAssinaturaDeTokensJWTQueDeveSerAlterada
# 24 hours in milliseconds
jwt.expiration=86400000

# SpringDoc OpenAPI Configuration
# Point Swagger UI to the existing OpenAPI spec file used by Camel
springdoc.swagger-ui.url=/openapi/api.yml
