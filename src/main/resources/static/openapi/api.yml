openapi: 3.0.3
info:
  title: cs-auth-orch
  description: Orquestrador de Autenticação e Gerenciamento de Usuários
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /login:
    post:
      summary: Autentica um usuário e retorna um token JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usuarios:
    post:
      summary: Cria um novo usuário
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          description: Requisição inválida

    get:
      summary: Lista todos os usuários
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResponse'

  /usuarios/{id}:
    get:
      summary: Busca um usuário pelo ID
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '404':
          description: Usuário não encontrado

    put:
      summary: Atualiza um usuário existente
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
      responses:
        '200':
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '404':
          description: Usuário não encontrado

    delete:
      summary: Remove um usuário
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Usuário removido com sucesso
        '404':
          description: Usuário não encontrado

  /token/validate:
    post:
      summary: Valida um token JWT
      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenValidationRequest'
      responses:
        '200':
          description: Token é válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '401':
          description: Token inválido ou expirado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string

    TipoUsuario:
      type: string
      enum: [ADMIN, DOADOR, BENEFICIARIO]

    UsuarioRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
        tipoUsuario:
          $ref: '#/components/schemas/TipoUsuario'

    UsuarioResponse:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        tipoUsuario:
          $ref: '#/components/schemas/TipoUsuario'

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    TokenValidationRequest:
      type: object
      properties:
        token:
          type: string

    TokenValidationResponse:
      type: object
      properties:
        isValid:
          type: boolean
        email:
          type: string
        userType:
          type: string
